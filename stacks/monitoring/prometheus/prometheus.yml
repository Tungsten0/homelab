global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    site: home
    environment: homelab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - 192.168.2.131:9100
        labels:
          host: docker01

      - targets:
          - 192.168.2.127:9100
        labels:
          host: fileserver


  - job_name: cadvisor
    static_configs:
      - targets:
          - 192.168.2.131:8080
        labels:
          host: docker01
